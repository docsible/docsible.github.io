    <style>
        /* Theme Variables */
        :root {
            --bg-color: rgb(0, 0, 0);
            --text-color: #fff;
            --tooltip-bg: rgba(255, 255, 255, 0.8);
            --tooltip-text: #000;
        }

        body.light-mode {
            --bg-color: #fff;
            --text-color: #000;
            --tooltip-bg: rgba(0, 0, 0, 0.8);
            --tooltip-text: #fff;
        }

        /* Global Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            overflow-x: hidden;
        }

        .theme-switch-wrapper {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .theme-switch {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .theme-switch input {
            display: none;
        }

        .security-notice {
            font-family: 'Inter', sans-serif;
            margin: 20px;
            margin-top: 50px;
            padding: 10px 20px;
            border: 2px solid #ffffff2e;
            border-radius: 4px;
            max-width: 90%;
            font-size: 1rem;
            line-height: 1.6;
            text-align: center;
        }

        .animation-content {
            font-family: 'Inter', sans-serif;
            margin: 20px;
            margin-top: 50px;
            padding-bottom: 50px;

            max-width: 90%;
            font-size: 1rem;
            line-height: 1.6;
            text-align: left;
        }

        .ansible-animation {
            border: 2px solid #ffffff2e;
            border-radius: 4px;
            width: 500px;
            max-width: 100ch;
            height: 50px;
            overflow: hidden;
            background: var(--bg-color);
            font-family: 'Share Tech Mono', monospace;
            padding: 0 10px;
            margin: 0 auto 1rem auto;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        h1.docsible {
            font-size: 5rem;
            letter-spacing: 0.5rem;
            margin: 0;
            margin-top: -100px;
            font-weight: normal;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .letter {
            position: relative;
            margin: 0 0.2rem;
            transition: transform 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .letter:hover {
            transform: scale(1.2);
        }

        @media (hover: hover) and (pointer: fine) {
            .letter:hover::after {
                content: attr(data-tooltip);
                position: absolute;
                top: 100%;
                left: 50%;
                transform: translateX(-50%);
                background-color: var(--tooltip-bg);
                color: var(--tooltip-text);
                padding: 4px 8px;
                border-radius: 4px;
                white-space: nowrap;
                margin-top: 8px;
                pointer-events: none;
                font-size: 1rem;
                z-index: 10;
            }
        }

        .desktop-letter {
            display: inline;
        }

        .mobile-word {
            display: none;
        }

        @media (max-width: 768px) {
            h1.docsible {
                display: block;
                font-size: 3rem;
                letter-spacing: normal;
                text-align: left;
                width: 100%;
                padding: 0 1em;
                margin-top: -100px;
            }

            .letter {
                display: flex;
                justify-content: flex-start;
                align-items: center;
                margin: 15px 0;
            }

            .desktop-letter {
                display: none;
            }

            .mobile-word {
                display: flex;
                flex-direction: row;
                align-items: center;
                margin: -13px;
                margin-left: 20px;
            }

            .mobile-first-letter {
                display: inline-block;
                /* width: 0.80em; */
                text-align: center;
                font-weight: bold;
            }

            .mobile-rest {
                display: inline-block;
                font-size: 0.8em;
                line-height: 1.2;
                margin-bottom: -8px;
                color: #bdbbaf;
            }

        }

        @media (max-width: 480px) {
            h1.docsible {
                font-size: 2.5rem;
            }

            .ansible-animation {
                width: 350px;
            }
        }

        .letter,
        .theme-switch,
        a {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .svg-icon {
            width: 1.8rem;
            height: 1.8rem;
            transition: transform 0.3s ease;
            color: var(--text-color);
            display: inline-block;
        }

        #sun-icon,
        #moon-icon {
            display: none;
        }

        body.light-mode #moon-icon {
            display: inline-block;
        }

        body.dark-mode #sun-icon {
            display: inline-block;
        }

        .task-container {
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 100ch;
        }

        .task-line {
            height: 25px;
            line-height: 25px;
            white-space: nowrap;
            text-align: left;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-line.play {
            color: var(--text-color);
        }

        .task-line.task {
            color: var(--text-color);
        }

        .task-line.ok {
            color: rgb(72, 107, 0);
        }

        .task-line.fatal {
            color: rgb(163, 0, 0);
            font-weight: bold;
        }

        .task-line.changed {
            color: rgb(121, 86, 0);
        }
    </style>

    <script>
        const DEBUG_MODE = false;

        function logDebug(...args) {
            if (DEBUG_MODE) console.log('[🌗 Docsible Debug]', ...args);
        }

        function getStoredScheme() {
            try {
                const raw = localStorage.getItem('/.__palette');
                logDebug('Raw palette:', raw);
                if (!raw) return 'dark';
                const palette = JSON.parse(raw);
                const scheme = palette?.index === 1 ? 'light' : 'dark';
                logDebug('Parsed scheme:', scheme);
                return scheme;
            } catch (e) {
                logDebug('Error parsing palette:', e);
                return 'dark';
            }
        }

        function setMkDocsPalette(scheme) {
            const isDark = scheme === 'dark';
            const palette = {
                index: isDark ? 0 : 1,
                color: {
                    media: "",
                    scheme: isDark ? "slate" : "default",
                    primary: "indigo",
                    accent: "indigo"
                }
            };
            localStorage.setItem('/.__palette', JSON.stringify(palette));
            logDebug('Saved palette to localStorage:', palette);
        }

        function applyBodyClass(scheme) {
            document.body.classList.remove('light-mode', 'dark-mode');
            document.body.classList.add(`${scheme}-mode`);
            document.documentElement.classList.remove('light-mode', 'dark-mode');
            document.documentElement.classList.add(`${scheme}-mode`);
            logDebug('Applied body/documentElement class:', `${scheme}-mode`);
        }

        const initialScheme = getStoredScheme();
        applyBodyClass(initialScheme);

        window.addEventListener('DOMContentLoaded', () => {
            const toggleSwitch = document.getElementById('theme-toggle');
            logDebug('DOMContentLoaded - toggle switch found:', !!toggleSwitch);

            if (toggleSwitch) {
                toggleSwitch.checked = initialScheme === 'light';
                logDebug('Set toggle checked:', toggleSwitch.checked);

                toggleSwitch.addEventListener('change', () => {
                    const scheme = toggleSwitch.checked ? 'light' : 'dark';
                    logDebug('Toggle changed:', scheme);
                    applyBodyClass(scheme);
                    setMkDocsPalette(scheme);
                });
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                const scheme = getStoredScheme();
                logDebug('Visibility change — reapplying scheme:', scheme);
                applyBodyClass(scheme);
                const toggle = document.getElementById('theme-toggle');
                if (toggle) {
                    toggle.checked = scheme === 'light';
                    logDebug('Synced toggle on visibility:', toggle.checked);
                }
            }
        });

        document.addEventListener("DOMContentLoaded", function () {
            const tasks = [
                'PLAY [initialize control plane for staging mesh]',
                'TASK [load inventory from edge.discovery.handlers]',
                'ok: [node-a1]',
                'TASK [configure etcd cluster]',
                'changed: [node-a1]',
                'TASK [bootstrap message bus]',
                'ok: [node-a1]',

                'PLAY [provision service mesh nodes]',
                'TASK [install container runtime from core.platform.docker]',
                'changed: [node-b3]',
                'TASK [pull base image for edge-processor]',
                'ok: [node-b3]',
                'TASK [enable overlayfs driver]',
                'ok: [node-b3]',

                'PLAY [configure secure overlay network]',
                'TASK [generate certs using crypto.vault.ca]',
                'changed: [node-c9]',
                'TASK [apply firewall baseline]',
                'ok: [node-c9]',
                'TASK [establish ipsec tunnels]',
                'changed: [node-c9]',

                'PLAY [finalize workload rollout]',
                'TASK [register services with internal registry]',
                'ok: [node-a1]',
                'TASK [run post-deploy checks]',
                'changed: [node-a1]',
                'TASK [emit metrics to observability pipeline]',
                'ok: [node-a1]'
            ];

            let currentIndex = 0;
            const container = document.getElementById("task-container");

            function createTaskLine(text) {
                const div = document.createElement("div");
                div.className = "task-line";
                div.textContent = text;
                applyColor(div, text);
                return div;
            }

            function applyColor(el, text) {
                el.classList.remove("play", "task", "ok", "fatal", "changed");
                if (text.startsWith("PLAY")) el.classList.add("play");
                else if (text.startsWith("TASK")) el.classList.add("task");
                else if (text.startsWith("ok:")) el.classList.add("ok");
                else if (text.startsWith("fatal:")) el.classList.add("fatal");
                else if (text.startsWith("changed:")) el.classList.add("changed");
            }

            container.appendChild(createTaskLine(tasks[currentIndex++ % tasks.length]));
            container.appendChild(createTaskLine(tasks[currentIndex++ % tasks.length]));

            function scrollTasks() {
                container.style.transform = "translateY(-25px)";
                container.addEventListener("transitionend", () => {
                    container.removeChild(container.firstElementChild);
                    const newLine = createTaskLine(tasks[currentIndex++ % tasks.length]);
                    container.appendChild(newLine);
                    container.style.transition = "none";
                    container.style.transform = "translateY(0)";
                    void container.offsetWidth;
                    container.style.transition = "transform 0.3s ease";
                }, { once: true });
            }

            setInterval(scrollTasks, 1000);
        });

    </script>
